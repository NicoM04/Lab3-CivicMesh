name: Agent - Documenter

# Ejecutable manualmente desde GitHub Actions (workflow_dispatch) y una vez
# al día (schedule). Nunca aprueba ni fusiona nada: solo puede crear
# issues (ver scripts/agents/README.md).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *" # una vez al día

permissions:
  contents: read
  issues: write

jobs:
  run-documenter:
    name: run-documenter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar agente Documentador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Proveedor de IA: por defecto apunta al endpoint compatible con
          # OpenAI de Google Gemini (capa gratis vía aistudio.google.com).
          # AGENT_API_KEY SÍ hay que configurarlo como secret del repo (no
          # hay token automático posible para un proveedor externo) — sin
          # él, is_configured() da False y el agente usa directamente su
          # fallback de análisis estático, sin intentar la llamada. Si más
          # adelante se prefiere otro proveedor compatible con OpenAI
          # (Groq, OpenAI, Azure OpenAI, OpenRouter...), basta con
          # sobrescribir los tres secrets, sin tocar código.
          AGENT_API_URL: ${{ secrets.AGENT_API_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions' }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL || 'gemini-3.6-flash' }}
        run: python -m scripts.agents.documenter
