version: '3.8'

networks:
  civicmesh_net:
    driver: bridge

volumes:
  metrics_vol:

services:
  peer-1:
    build: .
    image: civicmesh:base
    networks:
      - civicmesh_net
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - metrics_vol:/app/metrics
    command: ["python", "scripts/run_peer.py", "--peer-id", "peer-1", "--host", "0.0.0.0", "--port", "5000", "--topic", "Santiago", "--metrics-dir", "/app/metrics"]

  peer-2:
    build: .
    image: civicmesh:base
    networks:
      - civicmesh_net
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - metrics_vol:/app/metrics
    command: ["python", "scripts/run_peer.py", "--peer-id", "peer-2", "--host", "0.0.0.0", "--port", "5001", "--topic", "Santiago", "--seed-id", "peer-1", "--seed-host", "peer-1", "--seed-port", "5000", "--metrics-dir", "/app/metrics"]
    depends_on:
      - peer-1

  peer-3:
    build: .
    image: civicmesh:base
    networks:
      - civicmesh_net
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - metrics_vol:/app/metrics
    command: ["python", "scripts/run_peer.py", "--peer-id", "peer-3", "--host", "0.0.0.0", "--port", "5002", "--topic", "Santiago", "--seed-id", "peer-1", "--seed-host", "peer-1", "--seed-port", "5000", "--metrics-dir", "/app/metrics"]
    depends_on:
      - peer-1

  publicador-a:
    build: .
    image: civicmesh:base
    networks:
      - civicmesh_net
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - metrics_vol:/app/metrics
    command: ["python", "scripts/run_publisher.py", "--domain", "crime", "--comuna", "Santiago", "--peer-id", "publisher-a", "--host", "0.0.0.0", "--port", "9100", "--seed-id", "peer-1", "--seed-host", "peer-1", "--seed-port", "5000", "--metrics-dir", "/app/metrics"]
    depends_on:
      - peer-1

  publicador-b:
    build: .
    image: civicmesh:base
    profiles: ["domain-b"]
    networks:
      - civicmesh_net
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./datasets:/app/datasets:ro
      - metrics_vol:/app/metrics
    command: ["python", "scripts/run_publisher.py", "--domain", "air", "--comuna", "Santiago", "--peer-id", "publisher-b", "--host", "0.0.0.0", "--port", "9101", "--seed-id", "peer-1", "--seed-host", "peer-1", "--seed-port", "5000", "--metrics-dir", "/app/metrics"]
    depends_on:
      - peer-1

  frontend:
    build: .
    image: civicmesh:base
    networks:
      - civicmesh_net
    ports:
      - "8501:8501"
    volumes:
      - metrics_vol:/app/metrics
    command: ["python", "-m", "streamlit", "run", "civicmesh/analytics/frontend.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - peer-1
